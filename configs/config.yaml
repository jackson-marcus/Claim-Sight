# Pipeline configuration. Paths relative to the repo root.

data:
  processed_dir: data/processed
  artifacts_dir: data/artifacts
  n_claims: 20000
  seed: 42

severity:
  # train / calibration / test. The reserve uplift is fitted on the calibration
  # slice and its coverage measured on the test slice, which it never sees.
  test_frac: 0.2
  calibration_frac: 0.2
  reserve_levels: [0.50, 0.75, 0.90, 0.95, 0.99]
  reserve_primary_level: 0.75
  # Promotion gate: how far measured coverage may stray from the nominal level.
  adequacy_tolerance: 0.03
  lgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    verbose: -1

fraud_flags:
  late_report_days: 21
  round_amount_tolerance: 1.0
  claim_soon_after_policy_days: 30

routing:
  adjusters:
    - {name: junior_pool,  max_severity_usd: 8000,  capacity: 60}
    - {name: senior_pool,  max_severity_usd: 40000, capacity: 30}
    - {name: complex_unit, max_severity_usd: 999999999, capacity: 12}
  fraud_unit_threshold: 2     # flags at/above this go to SIU regardless

eval:
  experiment_name: claimsight
